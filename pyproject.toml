[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maid"
version = "0.0.1"
description = "Multi-Agent Investment Decision-making: LLM agents + MCDM"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "openai>=1.40",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
gui = ["streamlit>=1.39"]
data = ["yfinance>=0.2.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741"]  # long table/f-string lines in scripts; single-letter math names are intentional
