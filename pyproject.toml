[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maid"
version = "0.0.1"
description = "Multi-Agent Investment Decision-making: LLM agents + MCDM"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "openai>=1.40",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
